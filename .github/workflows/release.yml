name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump the version in manifest.json, const.py and the panel, push, and the release follows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Lint, Validate and HACS Validation workflows run on this very commit:
  # a commit whose checks fail is not released.
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  hacs:
    name: HACS Validation
    uses: ./.github/workflows/hacs.yml
    permissions:
      contents: read

  release:
    needs: [lint, validate, hacs]
    # A manual run on another branch would publish its unmerged commit as the latest release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r .version custom_components/energy_hub/manifest.json)"
          grep -q "^VERSION: Final = \"$VERSION\"" custom_components/energy_hub/const.py
          grep -q "ENERGY_HUB_PANEL_VERSION = '$VERSION'" custom_components/energy_hub/frontend/energy-hub-panel.js
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The Marketplace installs energy_hub.zip (hacs.json: zip_release).
      - name: Build zip and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          (cd custom_components/energy_hub && zip -r ../../energy_hub.zip . -x "__pycache__/*")
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: energy_hub.zip
          body_path: notes.md
          make_latest: true
