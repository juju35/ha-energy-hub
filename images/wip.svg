<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 132" width="720" height="132" role="img" aria-label="Work in progress: Energy Hub is in beta">
  <style>
    .t1{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#412402}
    .t2{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#633806}
    .t3{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#854F0B;letter-spacing:.08em}
    .swing{transform-origin:170px 30px;animation:swing 3.2s ease-in-out infinite}
    .fill{animation:fill 4s ease-in-out infinite}
    .ray{transform-origin:62px 46px;animation:spin 18s linear infinite}
    .beacon{animation:blink 1.1s steps(2,end) infinite}
    @keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @keyframes fill{0%{width:4px}70%,100%{width:118px}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes blink{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.swing,.fill,.ray,.beacon{animation:none}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4DC"/><stop offset="1" stop-color="#FCE3B4"/></linearGradient>
    <pattern id="hz" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#EF9F27"/><rect x="7" width="7" height="14" fill="#412402"/></pattern>
    <clipPath id="card"><rect width="720" height="132" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="132" fill="url(#sky)"/>
    <!-- sun wearing a hard hat -->
    <g class="ray" stroke="#EF9F27" stroke-width="3" stroke-linecap="round">
      <path d="M62 14v8M62 70v8M30 46h8M86 46h8M39 23l6 6M79 63l6 6M39 69l6-6M79 29l6-6"/>
    </g>
    <circle cx="62" cy="46" r="18" fill="#FAC775"/>
    <path d="M42 44a20 20 0 0 1 40 0z" fill="#EF9F27"/>
    <rect x="38" y="42" width="48" height="5" rx="2.5" fill="#BA7517"/>
    <rect x="59" y="27" width="6" height="12" rx="2" fill="#FAC775" opacity=".7"/>
    <circle cx="56" cy="52" r="1.8" fill="#412402"/><circle cx="68" cy="52" r="1.8" fill="#412402"/>
    <path d="M56 58q6 4 12 0" stroke="#412402" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- crane -->
    <path d="M118 120V22M118 22h96M118 22l20 -10h-20" stroke="#633806" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <path d="M118 40l18-18M118 64l18-18M118 88l18-18" stroke="#633806" stroke-width="2"/>
    <circle class="beacon" cx="214" cy="18" r="4" fill="#E24B4A"/>
    <g class="swing">
      <path d="M170 22v36" stroke="#412402" stroke-width="1.6"/>
      <path d="M164 58h12l-6 6z" fill="#412402"/>
      <!-- solar panel on the hook -->
      <g transform="translate(148 64) skewX(-12)">
        <rect width="48" height="26" rx="2" fill="#185FA5"/>
        <path d="M12 0v26M24 0v26M36 0v26M0 13h48" stroke="#85B7EB" stroke-width="1.2"/>
      </g>
    </g>
    <!-- house waiting for its panel -->
    <rect x="246" y="92" width="84" height="34" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
    <rect x="280" y="104" width="16" height="22" fill="#BA7517"/>
    <path d="M236 94l52-34 52 34z" fill="#BA7517" stroke="#854F0B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M262 82l26-17 26 17z" fill="none" stroke="#FAEEDA" stroke-width="1.6" stroke-dasharray="4 3"/>
    <!-- text -->
    <text x="372" y="40" class="t3">WORK IN PROGRESS · BETA</text>
    <text x="372" y="64" class="t1">Energy Hub is being built</text>
    <text x="372" y="86" class="t2">Every screen works in demo mode. The profiles</text>
    <text x="372" y="103" class="t2">still need real installations: yours is welcome.</text>
    <!-- battery: the build charging -->
    <rect x="566" y="28" width="122" height="16" rx="4" fill="none" stroke="#633806" stroke-width="2"/>
    <rect x="689" y="32" width="4" height="8" rx="1.5" fill="#633806"/>
    <rect class="fill" x="568" y="30" width="80" height="12" rx="2.5" fill="#639922"/>
    <!-- hazard tape along the bottom -->
    <rect y="124" width="720" height="8" fill="url(#hz)"/>
  </g>
</svg>
